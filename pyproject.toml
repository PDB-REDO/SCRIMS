[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scrims"
version = "0.1.0.dev0"
description = "SCRIMS: interaction sites, binding partners and shared motifs from AlphaFold structure-prediction screens"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "biopython>=1.81",   # structures (Bio.PDB), partner grouping (PairwiseAligner), BLOSUM62
]
# Not on PyPI, needed at run time: mkdssp (DSSP 4.x) for the default motif null (--motif-ss dssp;
# --motif-ss none needs nothing); Foldseek only for --motif-engine 3di_aa. environment.yml installs both.

[project.optional-dependencies]
zst = ["zstandard>=0.21"]   # only for .zst-compressed AFDB/ColabFold bulk downloads
dev = ["pytest>=7"]

[project.scripts]
scrims = "scrims.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Foldseek 3Di substitution matrix (3di_aa engine); ELM classes / interaction domains and Pfam clans
# (scrims.motif_candidates)
scrims = ["mat3di.txt", "data/*.tsv", "data/*.tsv.gz"]
