[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "confine"
version = "0.1.0.dev0"
description = "CONFidence INterface Extraction: confidence matrices and statistically supported interaction sites from AlphaFold2/AlphaFold3 screens"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
zst = ["zstandard>=0.21"]   # only for .zst-compressed AFDB/ColabFold bulk downloads
dev = ["pytest>=7"]

[project.scripts]
confine = "confine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
