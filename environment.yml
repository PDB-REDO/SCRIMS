# Conda environment for AlphaSIFT, including the test runner.
#
#   conda env create -f environment.yml
#   conda activate alphasift
#   pip install -e .
#   pytest
#
# AlphaSIFT itself needs only numpy, scipy, pandas and matplotlib; zstandard is
# needed only for .zst-compressed AFDB/ColabFold downloads, and pytest only to
# run the test suite. scipy must be >= 1.11 for scipy.stats.false_discovery_control.
name: alphasift
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=1.24
  - scipy>=1.11
  - pandas>=2.0
  - matplotlib>=3.7
  - zstandard>=0.21
  - pytest>=7
  - pip
